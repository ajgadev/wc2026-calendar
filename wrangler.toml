# Cloudflare Workers configuration (Workers Builds, free tier).
# The Astro adapter emits dist/_worker.js + static assets; the default
# deploy command `npx wrangler deploy` serves assets first and routes
# everything else (the /api/* endpoints) to the worker.
# Secrets (FOOTBALL_DATA_TOKEN, YOUTUBE_API_KEY) are runtime secrets set
# in the dashboard, never here.
name = "wc-2026-calendar"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
main = "dist/_worker.js/index.js"

[assets]
binding = "ASSETS"
directory = "dist"
